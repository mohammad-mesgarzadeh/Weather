<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="styles/output.css">
</head>

<body class="p-0 m-0 box-border min-h-screen">

    <canvas id="backgroundCanvas" class=" fixed top-0 left-0 w-full h-full z-[-1] bg-black"></canvas>

    <!-- Search bar and title -->

    <div class="max-w-4xl mx-auto mt-10">
        <div
            class="weather-card bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-6">

            <div class="w-full md:w-auto flex-shrink-0">
                <div class="main-title relative group">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl shadow-lg shadow-blue-500/30 transform group-hover:scale-[1.01] transition-transform duration-300">
                    </div>
                    <div
                        class="relative bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl py-3 px-6 text-center text-white overflow-hidden">
                        <div class="absolute bottom-0 left-0 w-full h-1 bg-white/20"></div>

                        <h1
                            class="text-xl md:text-2xl font-extrabold tracking-wide drop-shadow-md flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="w-6 h-6 md:w-8 md:h-8 text-yellow-300 animate-pulse" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                            </svg>
                            Weather Forecast
                        </h1>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-auto flex-grow flex flex-col md:flex-row items-center gap-3">

                <div class="relative w-full md:w-80 lg:w-96 z-20">
                    <input id="custom-city-input" type="text" placeholder="Enter the city name..."
                        class="w-full py-3 pl-4 pr-10 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 shadow-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-300" />

                    <button id="delete" type="button"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-red-500 hover:bg-red-50 p-1 rounded-full transition-colors duration-200 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>

                    <div id="custom-city-suggestions"
                        class="absolute left-0 right-0 top-full mt-2 bg-white border border-gray-100 rounded-xl shadow-xl overflow-hidden hidden "
                        style="max-height: 220px; overflow-y: auto;">
                        <div class="max-h-60 overflow-y-auto custom-scrollbar">
                        </div>
                    </div>
                </div>

                <button id="searchButton"
                    class="w-full md:w-18 lg:w-28 bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold shadow-md shadow-blue-500/30 transition duration-300 flex items-center justify-center gap-2 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    Search
                </button>
            </div>

        </div>
        <!-- current Weather Card -->
        <div id="currentWeatherCard" class="weather-card p-8  text-center ">

            <div class="bg-gray-100 p-8 rounded-3xl shadow-inner">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div
                        class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center transition-all hover:shadow-md hover:-translate-y-1">
                        <div class="text-xs text-gray-400 uppercase tracking-widest font-semibold mb-1">Location</div>
                        <h2 id="currentCityName" class="text-2xl font-extrabold text-gray-800 truncate">
                            Tehran
                        </h2>
                    </div>
                    <div
                        class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center transition-all hover:shadow-md hover:-translate-y-1">
                        <div class="text-xs text-gray-400 uppercase tracking-widest font-semibold mb-1">Date</div>
                        <p id="currentDate" class="text-lg font-medium text-gray-600">
                        </p>
                    </div>
                    <div
                        class="bg-gradient-to-br from-blue-500 to-cyan-600 p-4 rounded-2xl shadow-lg shadow-blue-500/30 flex flex-col justify-center items-center text-white relative overflow-hidden">
                        <div class="absolute -top-4 -right-4 w-16 h-16 bg-white/20 rounded-full blur-xl"></div>
                        <div class="text-xs text-blue-100 uppercase tracking-widest font-semibold mb-1">Temperature
                        </div>
                        <div class="flex items-baseline">
                            <p id="currentTemperature" class="text-5xl font-black leading-none">
                                25
                            </p>
                            <span class="text-xl font-bold ml-1">°C</span>
                        </div>
                    </div>
                    <div
                        class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center transition-all hover:shadow-md hover:-translate-y-1">
                        <div class="text-xs text-gray-400 uppercase tracking-widest font-semibold mb-1">Condition</div>
                        <p id="currentDescription" class="text-xl font-bold text-blue-600 capitalize">
                            Sunny
                        </p>
                    </div>
                </div>
            </div>
            <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full mt-6">

                    <div
                        class="flex items-center justify-between bg-white/60 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-300 group">
                        <div class="flex items-center gap-3">
                            <div
                                class="p-2 bg-blue-100 rounded-full text-blue-600 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2">
                                    </path>
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 font-medium uppercase tracking-wider">Wind</span>
                                <span class="text-lg font-bold text-gray-800 leading-none"><span
                                        id="currentWind">15</span> <span
                                        class="text-sm font-normal text-gray-500">km/h</span></span>
                            </div>
                        </div>
                    </div>

                    <div
                        class="flex items-center justify-between bg-white/60 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-300 group">
                        <div class="flex items-center gap-3">
                            <div
                                class="p-2 bg-cyan-100 rounded-full text-cyan-600 group-hover:bg-cyan-500 group-hover:text-white transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M12 2.69l5.74 5.88a5.98 5.98 0 0 1-8.48 8.48A6 6 0 0 1 5.5 13.5a6.12 6.12 0 0 1 1.26-3.5L12 2.69z">
                                    </path>
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 font-medium uppercase tracking-wider">Humidity</span>
                                <span class="text-lg font-bold text-gray-800 leading-none"><span
                                        id="currentHumidity">40</span> <span
                                        class="text-sm font-normal text-gray-500">%</span></span>
                            </div>
                        </div>
                    </div>

                    <div
                        class="flex items-center justify-between bg-white/60 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-300 group">
                        <div class="flex items-center gap-3">
                            <div
                                class="p-2 bg-indigo-100 rounded-full text-indigo-600 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M16 13v8m-8-8v8m4-8v8"></path>
                                    <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 font-medium uppercase tracking-wider">Rain</span>
                                <span class="text-lg font-bold text-gray-800 leading-none"><span
                                        id="currentPrecipitation">0</span> <span
                                        class="text-sm font-normal text-gray-500">%</span></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <p id="errorMessage"
                class="error-message bg-white/60 backdrop-blur-md border border-white/40 rounded-2xl p-4 shadow-sm">
            </p>
            <div id="loading" class="loading-container  "></div>


        </div>

        <!-- footer -->

        <div class="text-sm text-gray-500 text-center py-4 ">
            Coded by Mohammad Mesgarzadeh
        </div>

        <footer class="flex h-20 mt-2 w-full items-center justify-center ">
            <a class="w-10 h-10 rounded-full shadow-md hover:shadow-blue-500 transition transform hover:translate-y-[-10px] cursor-pointer"
                href="https://github.com/mohammad-mesgarzadeh"><img src="images/icons/GitHub.png" alt=""
                    class="invert"></a>
            <a class="w-10 h-10 rounded shadow-md hover:shadow-blue-500 transition transform hover:translate-y-[-10px] cursor-pointer "
                href="https://www.linkedin.com/in/mohammad-mesgarzadeh-a5422837a/"><img
                    src="images/icons/Linkedin(black&white).png" alt="" class="invert"></a>

            <div class="group relative inline-block">
                <div class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2
                bg-gray-800 text-white text-sm font-semibold py-2 px-3 rounded-lg shadow-lg
                opacity-0 scale-90 group-hover:opacity-100 group-hover:scale-100
                transition-all duration-300 pointer-events-none whitespace-nowrap">
                    m_mesgarzade@yahoo.com
                </div>
                <div
                    class="w-10 h-10 rounded shadow-md hover:shadow-blue-500 transition transform group-hover:-translate-y-2 cursor-pointer">
                    <img src="images/icons/email.png" class="w-full h-full object-contain invert" alt="">
                </div>

            </div>
            <div class="group relative inline-block">
                <div class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2
                bg-gray-800 text-white text-sm font-semibold py-2 px-3 rounded-lg shadow-lg
                opacity-0 scale-90 group-hover:opacity-100 group-hover:scale-100
                transition-all duration-300 pointer-events-none whitespace-nowrap">
                    09336153916
                </div>
                <div
                    class="w-10 h-10 rounded shadow-md hover:shadow-blue-500 transition transform group-hover:-translate-y-2 cursor-pointer">
                    <img src="images/icons/Phone.png" class="w-full h-full object-contain invert" alt="">
                </div>
            </div>
        </footer>

    </div>

    <script src="app.js"></script>
</body>

</html>
